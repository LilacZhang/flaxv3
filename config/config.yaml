training:
  env_name: Boxing
  env_type: atari          # 'atari' or 'mujoco_playground'
  obs_type: image          # 'image' or 'state'
  num_envs: 2
  seed: 1
  device: 0
  total_steps: 102000
  train_ratio: 1024
  batch_size: 16
  batch_length: 32
  imagine_length: 15
  prioritized: True
  use_datasets: False

eval:
  device: 0
  episodes: 100
  num_envs: 1
  env_name: Boxing
  env_type: atari
  obs_type: image
  ckpt_path: /home/lilac/PyProject/flaxv3/outputs/2026-03-14/13-53-37/Boxing/ckpt/100000


dreamerv3:
  encoder:
    image_shape: [64,64,3]
    depths: 32
    mults: [1,2,4,8]
    act: silu
    norm: BatchNorm

  rssm:
    hidden: 512
    layers: 1
    deter: 512
    group: 8
    stoch: 32
    classes: 32
    act: silu
    norm: LayerNorm

  decoder:
    channels: 3
    depths: 32
    mults: [1,2,4,8]
    act: silu
    norm: BatchNorm

  state_encoder:
    state_dim: 0           # auto-detected from env, 0 = auto
    hidden: 512
    layers: 3
    act: silu
    norm: LayerNorm

  state_decoder:
    state_dim: 0
    hidden: 512
    layers: 3
    act: silu
    norm: LayerNorm

agent:
  feat_dim: 1536
  hidden_dim: 512
  layers: 2
  gamma: 0.997
  lmbda: 0.95
  entropy_coef: 0.0003
  act: silu
  norm: LayerNorm
